
package com.ozbekkeyboard;

import android.inputmethodservice.InputMethodService;
import android.graphics.Color;
import android.content.res.ColorStateList;
import android.view.View;
import android.view.Gravity;
import android.view.MotionEvent;
import android.view.inputmethod.InputConnection;
import android.widget.Button;
import android.widget.LinearLayout;
import android.os.Handler;
import android.os.Looper;

import java.util.Locale;

public class KeyboardService extends InputMethodService {

    private String language = "UZ";
    private boolean dark = true;
    private boolean shift = false;

    private LinearLayout root;

    private final Handler handler = new Handler(Looper.getMainLooper());

    private Runnable deleteRunnable;

    private int dp(int value) {
        return (int) (value * getResources()
                .getDisplayMetrics().density + 0.5f);
    }

    @Override
    public View onCreateInputView() {
        return makeKeyboard();
    }

    private Button key(String label, Runnable action) {

        Button b = new Button(this);

        b.setText(label);
        b.setTextSize(16);
        b.setAllCaps(false);
        b.setPadding(0, 0, 0, 0);

        b.setMinWidth(0);
        b.setMinimumWidth(0);
        b.setMinHeight(0);
        b.setMinimumHeight(0);

        b.setBackgroundTintList(
                ColorStateList.valueOf(
                        dark
                        ? Color.rgb(65, 68, 75)
                        : Color.WHITE
                )
        );

        b.setTextColor(
                dark ? Color.WHITE : Color.rgb(30, 30, 30)
        );

        b.setOnClickListener(v -> action.run());

        return b;
    }

    private LinearLayout newRow() {

        LinearLayout row = new LinearLayout(this);

        row.setOrientation(LinearLayout.HORIZONTAL);
        row.setGravity(Gravity.CENTER);

        return row;
    }

    private void addKey(
            LinearLayout row,
            String label,
            float weight,
            Runnable action
    ) {

        Button b = key(label, action);

        LinearLayout.LayoutParams p =
                new LinearLayout.LayoutParams(
                        0,
                        dp(49),
                        weight
                );

        p.setMargins(dp(2), dp(3), dp(2), dp(3));

        row.addView(b, p);
    }

    private void addNormalRow(String[] keys) {

        LinearLayout row = newRow();

        for (String k : keys) {

            String shown = shift
                    ? k.toUpperCase(Locale.ROOT)
                    : k;

            addKey(row, shown, 1, () -> {

                String value = shift
                        ? k.toUpperCase(Locale.ROOT)
                        : k.toLowerCase(Locale.ROOT);

                type(value);
            });
        }

        root.addView(row);
    }

    private void addNumberRow() {

        LinearLayout row = newRow();

        for (int i = 1; i <= 9; i++) {

            final String number = String.valueOf(i);

            addKey(row, number, 1, () -> type(number));
        }

        addKey(row, "0", 1, () -> type("0"));

        root.addView(row);
    }

    private void addShiftButton(LinearLayout row) {

        addKey(row, shift ? "⬆" : "⇧", 1.3f, () -> {

            shift = !shift;
            refresh();
        });
    }

    private void addBackspace(LinearLayout row) {

        Button back = key("⌫", () -> {});

        LinearLayout.LayoutParams p =
                new LinearLayout.LayoutParams(
                        0,
                        dp(49),
                        1.4f
                );

        p.setMargins(dp(2), dp(3), dp(2), dp(3));

        row.addView(back, p);

        deleteRunnable = new Runnable() {

            @Override
            public void run() {

                type("⌫");

                handler.postDelayed(this, 65);
            }
        };

        back.setOnTouchListener((v, event) -> {

            if (event.getAction() == MotionEvent.ACTION_DOWN) {

                handler.removeCallbacks(deleteRunnable);

                type("⌫");

                handler.postDelayed(deleteRunnable, 400);

                return true;
            }

            if (event.getAction() == MotionEvent.ACTION_UP ||
                event.getAction() == MotionEvent.ACTION_CANCEL) {

                handler.removeCallbacks(deleteRunnable);

                return true;
            }

            return true;
        });
    }

    private void addBottomRow() {

        LinearLayout row = newRow();

        addKey(row, "🌐", 1.1f, () -> {

            language = language.equals("UZ")
                    ? "RU"
                    : language.equals("RU")
                    ? "EN"
                    : "UZ";

            shift = false;
            refresh();
        });

        addKey(row, ",", 0.8f, () -> type(","));

        addKey(row, "space", 4.5f, () -> type("space"));

        addKey(row, ".", 0.8f, () -> type("."));

        addKey(row, "↵", 1.1f, () -> type("↵"));

        root.addView(row);
    }

    private void type(String s) {

        InputConnection ic = getCurrentInputConnection();

        if (ic == null) return;

        if (s.equals("⌫")) {

            CharSequence before = ic.getTextBeforeCursor(2, 0);

            if (before != null && before.length() >= 2 &&
                    Character.isSurrogatePair(
                            before.charAt(before.length() - 2),
                            before.charAt(before.length() - 1))) {

                ic.deleteSurroundingText(2, 0);

            } else {

                ic.deleteSurroundingText(1, 0);
            }

        } else if (s.equals("↵")) {

            ic.commitText("\n", 1);

        } else if (s.equals("space")) {

            ic.commitText(" ", 1);

        } else {

            ic.commitText(s, 1);
        }
    }

    private View makeKeyboard() {

        root = new LinearLayout(this);

        root.setOrientation(LinearLayout.VERTICAL);

        root.setPadding(dp(3), dp(5), dp(3), dp(5));

        root.setBackgroundColor(
                dark
                ? Color.rgb(35, 37, 42)
                : Color.rgb(225, 228, 233)
        );

        // TOP ROW

        LinearLayout top = newRow();

        addKey(top, "Özbek Keyboard", 2.5f, () -> {});

        addKey(top, language + " ▼", 1.2f, () -> {

            language = language.equals("UZ")
                    ? "RU"
                    : language.equals("RU")
                    ? "EN"
                    : "UZ";

            shift = false;
            refresh();
        });

        addKey(top, dark ? "☀" : "☾", 0.8f, () -> {

            dark = !dark;
            refresh();
        });

        root.addView(top);

        // NUMBERS

        addNumberRow();

        // LETTERS

        if (language.equals("UZ")) {

            addNormalRow(new String[]{
                    "Q","W","E","R","T",
                    "Y","U","I","O","P"
            });

            addNormalRow(new String[]{
                    "A","S","D","F","G",
                    "H","J","K","L"
            });

            LinearLayout row = newRow();

            addShiftButton(row);

            addNormalKeys(row, new String[]{
                    "Z","X","C","V","B","N","M"
            });

            addNormalKeys(row, new String[]{
                    "Ö","Ğ","Ç","Ş"
            });

            addBackspace(row);

            root.addView(row);

        } else if (language.equals("EN")) {

            addNormalRow(new String[]{
                    "Q","W","E","R","T",
                    "Y","U","I","O","P"
            });

            addNormalRow(new String[]{
                    "A","S","D","F","G",
                    "H","J","K","L"
            });

            LinearLayout row = newRow();

            addShiftButton(row);

            addNormalKeys(row, new String[]{
                    "Z","X","C","V","B","N","M"
            });

            addBackspace(row);

            root.addView(row);

        } else {

            addNormalRow(new String[]{
                    "Й","Ц","У","К","Е",
                    "Н","Г","Ш","Щ","З","Х"
            });

            addNormalRow(new String[]{
                    "Ф","Ы","В","А","П",
                    "Р","О","Л","Д","Ж","Э"
            });

            LinearLayout row = newRow();

            addShiftButton(row);

            addNormalKeys(row, new String[]{
                    "Я","Ч","С","М","И","Т","Ь","Б","Ю"
            });

            addBackspace(row);

            root.addView(row);
        }

        // BOTTOM ROW

        addBottomRow();

        return root;
    }

    private void addNormalKeys(
            LinearLayout row,
            String[] keys
    ) {

        for (String k : keys) {

            String shown = shift
                    ? k.toUpperCase(Locale.ROOT)
                    : k;

            addKey(row, shown, 1, () -> {

                String value = shift
                        ? k.toUpperCase(Locale.ROOT)
                        : k.toLowerCase(Locale.ROOT);

                type(value);
            });
        }
    }

    private void refresh() {

        setInputView(makeKeyboard());
    }

    @Override
    public void onDestroy() {

        if (deleteRunnable != null) {
            handler.removeCallbacks(deleteRunnable);
        }

        super.onDestroy();
    }
}
