name: Build Ozbek Keyboard

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/ozbekkeyboard app/src/main/res/xml

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "OzbekKeyboard"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.0' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.ozbekkeyboard'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.ozbekkeyboard'
                  minSdk 23
                  targetSdk 34
                  versionCode 8
                  versionName '8.0'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:label="Özbek Keyboard">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service android:name=".KeyboardService"
                      android:label="Özbek Keyboard"
                      android:permission="android.permission.BIND_INPUT_METHOD"
                      android:exported="true">
                      <intent-filter><action android:name="android.view.InputMethod"/></intent-filter>
                      <meta-data android:name="android.view.im" android:resource="@xml/method"/>
                  </service>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/xml/method.xml <<'EOF'
          <input-method xmlns:android="http://schemas.android.com/apk/res/android"
              android:supportsSwitchingToNextInputMethod="true">
              <subtype android:label="Özbekcha" android:imeSubtypeLocale="uz"
                  android:imeSubtypeMode="keyboard"/>
          </input-method>
          EOF

          cat > app/src/main/java/com/ozbekkeyboard/MainActivity.java <<'EOF'
          package com.ozbekkeyboard;
          import android.app.Activity;
          import android.os.Bundle;
          import android.content.Context;
          import android.content.Intent;
          import android.provider.Settings;
          import android.view.inputmethod.InputMethodManager;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          public class MainActivity extends Activity {
              @Override public void onCreate(Bundle b) {
                  super.onCreate(b);
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(32, 48, 32, 32);
                  TextView title = new TextView(this);
                  title.setText("🇺🇿 Özbek Keyboard 8.0");
                  title.setTextSize(26);
                  root.addView(title);
                  TextView info = new TextView(this);
                  info.setText("\nSamsung stilidagi mukammal O‘zbekcha klaviatura\n\n• Kichik va katta harflarga o'tish (Shift) to'liq tuzatildi\n• Ichki Emoji paneli qo'shildi\n• Samsung uslubidagi maxsus belgilar (?123) qo'shildi");
                  info.setTextSize(16);
                  root.addView(info);
                  Button enable = new Button(this);
                  enable.setText("Klaviaturani yoqish");
                  enable.setOnClickListener(v -> startActivity(new Intent(Settings.ACTION_INPUT_METHOD_SETTINGS)));
                  root.addView(enable);
                  Button select = new Button(this);
                  select.setText("Klaviaturani tanlash");
                  select.setOnClickListener(v -> ((InputMethodManager)getSystemService(Context.INPUT_METHOD_SERVICE)).showInputMethodPicker());
                  root.addView(select);
                  setContentView(root);
              }
          }
          EOF

          cat > app/src/main/java/com/ozbekkeyboard/KeyboardService.java <<'EOF'
          package com.ozbekkeyboard;

          import android.inputmethodservice.InputMethodService;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.View;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.inputmethod.InputConnection;
          import android.widget.TextView;
          import android.widget.LinearLayout;

          public class KeyboardService extends InputMethodService {
              private String language = "UZ";
              private boolean dark = true, shift = true, deleting = false;
              private String mode = "KEYS"; // "KEYS", "EMOJI", "SYMBOLS"
              private LinearLayout root;
              private final Handler handler = new Handler(Looper.getMainLooper());

              private final Runnable repeatDelete = new Runnable() {
                  @Override public void run() {
                      if (deleting) {
                          deleteOnce();
                          handler.postDelayed(this, 60);
                      }
                  }
              };

              private int dp(float n) {
                  return (int)(n * getResources().getDisplayMetrics().density + 0.5f);
              }

              private void deleteOnce() {
                  InputConnection ic = getCurrentInputConnection();
                  if (ic != null) ic.deleteSurroundingText(1, 0);
              }

              private void type(String s) {
                  InputConnection ic = getCurrentInputConnection();
                  if (ic == null) return;
                  switch (s) {
                      case "⌫": deleteOnce(); break;
                      case "↵": ic.commitText("\n", 1); break;
                      case "SPACE": ic.commitText(" ", 1); break;
                      case "SHIFT": shift = !shift; refresh(); break;
                      case "LANG":
                          language = language.equals("UZ") ? "RU" : language.equals("RU") ? "EN" : "UZ";
                          shift = true; mode = "KEYS"; refresh(); break;
                      case "THEME": dark = !dark; refresh(); break;
                      case "EMOJI_MODE": mode = "EMOJI"; refresh(); break;
                      case "SYM_MODE": mode = "SYMBOLS"; refresh(); break;
                      case "KEY_MODE": mode = "KEYS"; refresh(); break;
                      default: ic.commitText(s, 1); break;
                  }
              }

              private GradientDrawable bg(int color) {
                  GradientDrawable d = new GradientDrawable();
                  d.setColor(color);
                  d.setCornerRadius(dp(7));
                  return d;
              }

              private TextView key(String label, String action, boolean special) {
                  TextView b = new TextView(this);
                  b.setText(label);
                  b.setTextSize(20);
                  b.setGravity(Gravity.CENTER);
                  b.setSingleLine(true);
                  b.setTypeface(Typeface.SANS_SERIF, Typeface.NORMAL);
                  int color = dark
                      ? (special ? Color.rgb(50, 54, 63) : Color.rgb(63, 68, 79))
                      : (special ? Color.rgb(180, 190, 205) : Color.WHITE);
                  b.setBackground(bg(color));
                  b.setTextColor(dark ? Color.WHITE : Color.rgb(20, 20, 20));

                  if ("⌫".equals(action)) {
                      b.setOnTouchListener((v, e) -> {
                          if (e.getAction() == MotionEvent.ACTION_DOWN) {
                              deleting = true; deleteOnce(); handler.postDelayed(repeatDelete, 350); return true;
                          }
                          if (e.getAction() == MotionEvent.ACTION_UP || e.getAction() == MotionEvent.ACTION_CANCEL) {
                              deleting = false; handler.removeCallbacks(repeatDelete); return true;
                          }
                          return true;
                      });
                  } else {
                      b.setOnClickListener(v -> type(action));
                  }
                  return b;
              }

              private void row(String[] labels, String[] actions, int height, boolean special) {
                  LinearLayout r = new LinearLayout(this);
                  r.setOrientation(LinearLayout.HORIZONTAL);
                  r.setGravity(Gravity.CENTER);
                  for (int i = 0; i < labels.length; i++) {
                      TextView b = key(labels[i], actions[i], special);
                      LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(0, dp(height), 1);
                      p.setMargins(dp(1.5f), dp(3.5f), dp(1.5f), dp(3.5f));
                      r.addView(b, p);
                  }
                  root.addView(r);
              }

              private void letters(String[] upperArr, String[] lowerArr, int h) {
                  String[] labels = new String[upperArr.length];
                  String[] actions = new String[upperArr.length];
                  for (int i = 0; i < upperArr.length; i++) {
                      labels[i] = shift ? upperArr[i] : lowerArr[i];
                      actions[i] = labels[i];
                  }
                  row(labels, actions, h, false);
              }

              private void header() {
                  row(new String[]{"Özbek Keyboard", language + " ▼", dark ? "☀" : "☾"},
                      new String[]{"", "LANG", "THEME"}, 40, true);
              }

              private void bottom(boolean isSymbolOrEmoji) {
                  String[] labels = {"?123", "😊", ",", "space", ".", "⌫", "↵"};
                  String[] actions = {isSymbolOrEmoji ? "KEY_MODE" : "SYM_MODE", "EMOJI_MODE", ",", "SPACE", ".", "⌫", "↵"};
                  float[] weights = {1.2f, 1.1f, 1f, 4.2f, 1f, 1.2f, 1.3f};
                  LinearLayout r = new LinearLayout(this);
                  r.setGravity(Gravity.CENTER);
                  for (int i = 0; i < labels.length; i++) {
                      TextView b = key(labels[i], actions[i], true);
                      LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(0, dp(58), weights[i]);
                      p.setMargins(dp(1.5f), dp(3.5f), dp(1.5f), dp(3.5f));
                      r.addView(b, p);
                  }
                  root.addView(r);
              }

              private void uzbek() {
                  letters(new String[]{"Q", "W", "E", "R", "T", "Y", "U", "I", "O", "Ö", "P"}, 
                          new String[]{"q", "w", "e", "r", "t", "y", "u", "i", "o", "ö", "p"}, 56);
                  letters(new String[]{"A", "S", "Ş", "D", "F", "Ğ", "G", "H", "J", "K", "L"}, 
                          new String[]{"a", "s", "ş", "d", "f", "ğ", "g", "h", "j", "k", "l"}, 56);
                  
                  String[] r3Labels = shift ? new String[]{"⇧", "Z", "X", "C", "Ç", "V", "B", "N", "M", "⌫"} : new String[]{"⇧", "z", "x", "c", "ç", "v", "b", "n", "m", "⌫"};
                  String[] r3Actions = {"SHIFT", r3Labels[1], r3Labels[2], r3Labels[3], r3Labels[4], r3Labels[5], r3Labels[6], r3Labels[7], r3Labels[8], "⌫"};
                  row(r3Labels, r3Actions, 56, true);
              }

              private void english() {
                  letters(new String[]{"Q","W","E","R","T","Y","U","I","O","P"}, 
                          new String[]{"q","w","e","r","t","y","u","i","o","p"}, 56);
                  letters(new String[]{"A","S","D","F","G","H","J","K","L"}, 
                          new String[]{"a","s","d","f","g","h","j","k","l"}, 56);
                  
                  String[] r3Labels = shift ? new String[]{"⇧","Z","X","C","V","B","N","M","⌫"} : new String[]{"⇧","z","x","c","v","b","n","m","⌫"};
                  String[] r3Actions = {"SHIFT", r3Labels[1], r3Labels[2], r3Labels[3], r3Labels[4], r3Labels[5], r3Labels[6], r3Labels[7], "⌫"};
                  row(r3Labels, r3Actions, 56, true);
              }

              private void russian() {
                  letters(new String[]{"Й","Ц","У","К","Е","Н","Г","Ш","Щ","З","Х"}, 
                          new String[]{"й","ц","у","к","е","н","г","ш","щ","з","х"}, 56);
                  letters(new String[]{"Ф","Ы","В","А","П","Р","О","Л","Д","Ж","Э"}, 
                          new String[]{"ф","ы","в","а","п","р","о","л","д","ж","э"}, 56);
                  
                  String[] r3Labels = shift ? new String[]{"⇧","Я","Ч","С","М","И","Т","Ь","Б","Ю","⌫"} : new String[]{"⇧","я","ч","с","м","и","т","ь","б","ю","⌫"};
                  String[] r3Actions = {"SHIFT", r3Labels[1], r3Labels[2], r3Labels[3], r3Labels[4], r3Labels[5], r3Labels[6], r3Labels[7], r3Labels[8], r3Labels[9], "⌫"};
                  row(r3Labels, r3Actions, 56, true);
              }

              private void symbols() {
                  row(new String[]{"1","2","3","4","5","6","7","8","9","0"}, new String[]{"1","2","3","4","5","6","7","8","9","0"}, 54, false);
                  row(new String[]{"@","#","$","_","&","-","+","(",")","/"}, new String[]{"@","#","$","_","&","-","+","(",")","/"}, 54, false);
                  row(new String[]{"*",":",";","!","?","\"","'","\\","⌫"}, new String[]{"*",":",";","!","?","\"","'","\\","⌫"}, 54, true);
                  bottom(true);
              }

              private void emojis() {
                  row(new String[]{"😀","😂","😍","😎","😊","👍","🔥","❤️","✨","🙏"}, new String[]{"😀","😂","😍","😎","😊","👍","🔥","❤️","✨","🙏"}, 54, false);
                  row(new String[]{"🎉","👑","😢","😡","🤔","👀","💯","🎉","💡","🚀"}, new String[]{"🎉","👑","😢","😡","🤔","👀","💯","🎉","💡","🚀"}, 54, false);
                  row(new String[]{"👍","👎","👏","🤝","💪","💔","🌹","☕","⌫"}, new String[]{"👍","👎","👏","🤝","💪","💔","🌹","☕","⌫"}, 54, true);
                  bottom(true);
              }

              private View makeKeyboard() {
                  deleting = false;
                  handler.removeCallbacks(repeatDelete);
                  root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(dp(2), dp(4), dp(2), dp(6));
                  root.setBackgroundColor(dark ? Color.rgb(25, 27, 33) : Color.rgb(215, 220, 228));
                  header();

                  if (mode.equals("SYMBOLS")) {
                      symbols();
                  } else if (mode.equals("EMOJI")) {
                      emojis();
                  } else {
                      String[] nums = {"1","2","3","4","5","6","7","8","9","0"};
                      row(nums, nums, 48, false);
                      if (language.equals("UZ")) uzbek();
                      else if (language.equals("RU")) russian();
                      else english();
                      bottom(false);
                  }
                  return root;
              }

              private void refresh() { setInputView(makeKeyboard()); }
              @Override public View onCreateInputView() { return makeKeyboard(); }
              @Override public void onFinishInputView(boolean finishingInput) {
                  deleting = false;
                  handler.removeCallbacks(repeatDelete);
                  super.onFinishInputView(finishingInput);
              }
          }
          EOF

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ozbek-Keyboard-APK
          path: app/build/outputs/apk/debug/app-debug.apk
